interface:
  display_name: "Unslop"
  short_description: "Cut AI tells, defensive phrasing, and session leakage from any writing"
  default_prompt: "Use $unslop to edit this text: scan for AI patterns (puffery, AI vocabulary, em dashes, quote overuse, chatbot phrases, jargon), defensive phrasing, and chain-of-thought leakage; rewrite with plain speech and add human voice while preserving meaning and tone."
policy:
  allow_implicit_invocation: true
