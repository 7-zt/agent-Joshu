default_language_version:
  python: "3"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: check-commit-message
        name: check-commit-message
        entry: uv run --no-sync gitlint
        language: system
        stages: [commit-msg]
        args: [--config, .gitlint, --msg-filename]
      - id: check-ast
        name: check-ast
        entry: uv run --no-sync check-ast
        language: system
        types: [python]
      - id: check-case-conflict
        name: check-case-conflict
        entry: uv run --no-sync check-case-conflict
        language: system
      - id: check-toml
        name: check-toml
        entry: uv run --no-sync check-toml
        language: system
        types: [toml]
      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: uv run --no-sync end-of-file-fixer
        language: system
        types: [text]
      - id: mixed-line-ending
        name: mixed-line-ending
        entry: uv run --no-sync mixed-line-ending
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trailing-whitespace
        entry: uv run --no-sync trailing-whitespace-fixer
        language: system
        types: [text]
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
      - id: ty
        name: ty
        entry: uv run --no-sync ty check src --force-exclude
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --no-sync pytest -q
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npx --yes prettier@3 --check --ignore-unknown
        language: system
        types: [markdown]
        exclude: ^(?:\.agents|\.omp)/
